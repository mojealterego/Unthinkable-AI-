name: Source trace integrity
on:
  push:
    branches: [main]
    paths:
      - "requirements/**"
      - "tools/verify_source_trace.py"
      - ".github/workflows/traceability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_requirements.py
      - run: python tools/verify_source_trace.py

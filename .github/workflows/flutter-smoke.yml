name: Flutter Android smoke build
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Initialize generated Android native project
        run: flutter create --project-name unthinkable_ai --platforms android .
      - name: Use Android API 36 required by Flutter plugins
        run: |
          test -f android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enforce plugin Android API 36 for file_picker
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          root = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache"))) / "hosted"
          candidates = list(root.glob("*/file_picker-*/android/build.gradle"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one file_picker Android plugin, got {candidates}")
          file = candidates[0]
          content = file.read_text(encoding="utf-8")
          replaced, count = re.subn(
              r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:34|flutter\.compileSdkVersion)\b",
              r"\g<1>36", content,
          )
          if count != 1:
              raise SystemExit("file_picker compileSdk declaration changed; review plugin rather than silently patch")
          file.write_text(replaced, encoding="utf-8")
          print(f"file_picker Android plugin compileSdk set to 36 in {file.name}")
          PY
      - name: Static analyzer
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build unsigned debug APK for smoke validation
        run: flutter build apk --debug
      - name: Publish debug APK from CI
        uses: actions/upload-artifact@v4
        with:
          name: unthinkable-ai-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Flutter Android smoke build
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Initialize generated Android native project
        run: flutter create --project-name unthinkable_ai --platforms android .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analyzer
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build unsigned debug APK for smoke validation
        run: flutter build apk --debug
      - name: Publish debug APK from CI
        uses: actions/upload-artifact@v4
        with:
          name: unthinkable-ai-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
